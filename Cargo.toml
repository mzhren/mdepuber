[workspace]
resolver = "2"
members = ["crates/mdepub-core", "crates/mdepub-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = "0.4"
toml = "1"
serde_yaml_ng = "0.10"
anyhow = "1"
walkdir = "2"
regex = "1"
lol_html = "2"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "v5"] }
dirs = "6"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
mdbook-core = "0.5.4"
mdbook-driver = "0.5.4"
mdbook-renderer = "0.5.4"
mdbook-preprocessor = "0.5.4"
mdbook-markdown = "0.5.4"
epub-builder = "0.8"
image = { version = "0.25", default-features = false }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
